# XcodeGen spec. Regenerate the .xcodeproj with:  xcodegen generate
# The .xcodeproj is a build artifact; this file is the source of truth.
name: VibeFlow

options:
  bundleIdPrefix: one.floo
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Stable signing keeps the Accessibility (TCC) grant across rebuilds. One team for
    # every configuration, so a Debug build and a shipped Release build share the grant.
    # Forking? Put your own team id here (a free personal team from the Apple ID signed in
    # to Xcode is enough for Debug) and change PRODUCT_BUNDLE_IDENTIFIER below;
    # one.floo.vibeflow belongs to the author's team.
    DEVELOPMENT_TEAM: X7UXDLS9F7
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: NO
  configs:
    Debug:
      # Xcode manages the Apple Development certificate.
      CODE_SIGN_STYLE: Automatic
    Release:
      # Shipped builds: Developer ID (needs the paid Apple Developer Program), then
      # notarized by scripts/release.sh. Manual, so xcodebuild never asks Xcode for help.
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      # Timestamp the signature so it stays valid after the certificate expires.
      OTHER_CODE_SIGN_FLAGS: "--timestamp"

packages:
  VibeFlowCore:
    path: VibeFlowCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.2

targets:
  VibeFlow:
    type: application
    platform: macOS
    sources:
      - path: VibeFlow
        excludes:
          - "Info.plist"
    dependencies:
      - package: VibeFlowCore
      - package: KeyboardShortcuts
      - package: KeychainAccess
    info:
      path: VibeFlow/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true            # agent app: no Dock icon, no focus steal
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "MIT License"
        NSMicrophoneUsageDescription: "VibeFlow records your voice while you hold the record shortcut and turns it into text."
        NSSpeechRecognitionUsageDescription: "VibeFlow can transcribe dictation on this Mac with Apple's on-device speech recognition."
    entitlements:
      path: VibeFlow/VibeFlow.entitlements
      properties:
        # Hardened runtime blocks the microphone without this, even after the user allows it.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.floo.vibeflow
        PRODUCT_NAME: VibeFlow
        PRODUCT_MODULE_NAME: VibeFlow
        # Release version. Bump both before scripts/release.sh --publish; the build number
        # must grow with every release.
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # Debug is a second app, "VibeFlow Dev", so it runs next to the installed release:
        # its own bundle id (own settings, own Accessibility and Microphone grants), a DEV
        # tag in the menu bar and Control added to every default shortcut. API keys are shared.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: one.floo.vibeflow.dev
          PRODUCT_NAME: VibeFlow Dev
        # No App Sandbox: the Accessibility API cannot read other apps from inside the sandbox.

schemes:
  VibeFlow:
    build:
      targets:
        VibeFlow: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: VibeFlowCore/VibeFlowCoreTests
