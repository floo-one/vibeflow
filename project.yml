# XcodeGen spec. Regenerate the .xcodeproj with:  xcodegen generate
# The .xcodeproj is a build artifact; this file is the source of truth.
name: VibeFlow

options:
  bundleIdPrefix: one.floo
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Stable signing keeps the Accessibility (TCC) grant across rebuilds.
    # Free personal team from the Apple ID signed in to Xcode (Settings > Accounts).
    # Forking? Put your own team id here and change PRODUCT_BUNDLE_IDENTIFIER below;
    # one.floo.vibeflow belongs to the author's team.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: Y798SH49X3
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: NO

packages:
  VibeFlowCore:
    path: VibeFlowCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.2

targets:
  VibeFlow:
    type: application
    platform: macOS
    sources:
      - path: VibeFlow
        excludes:
          - "Info.plist"
    dependencies:
      - package: VibeFlowCore
      - package: KeyboardShortcuts
      - package: KeychainAccess
    info:
      path: VibeFlow/Info.plist
      properties:
        CFBundleDisplayName: VibeFlow
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true            # agent app: no Dock icon, no focus steal
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "MIT License"
        NSMicrophoneUsageDescription: "VibeFlow records your voice while you hold the record shortcut and turns it into text."
        NSSpeechRecognitionUsageDescription: "VibeFlow can transcribe dictation on this Mac with Apple's on-device speech recognition."
    entitlements:
      path: VibeFlow/VibeFlow.entitlements
      properties:
        # Hardened runtime blocks the microphone without this, even after the user allows it.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.floo.vibeflow
        PRODUCT_NAME: VibeFlow
        GENERATE_INFOPLIST_FILE: NO
        # No App Sandbox: the Accessibility API cannot read other apps from inside the sandbox.

schemes:
  VibeFlow:
    build:
      targets:
        VibeFlow: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: VibeFlowCore/VibeFlowCoreTests
