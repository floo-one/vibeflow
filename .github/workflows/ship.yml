name: Ship

# Builds, signs, notarizes and publishes Maagical after CI passed on a push to main:
# - project.yml has a MARKETING_VERSION without a tag yet: the release v<version> (tag, GitHub
#   release marked Latest, appcast.xml), then a nightly of the same commit so the Nightly
#   channel moves past it too.
# - otherwise: the nightly (rolling "nightly" pre-release), unless the commit only changes the
#   website, is already the nightly, or main has moved on (that newer run ships instead).
# Run it by hand (Actions > Ship > Run workflow) to rebuild the nightly of the current main.
#
# Secrets live in the "release" environment, which only main may use. docs/DEVELOPMENT.md
# "Release" lists them and how to create each one.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# One at a time; a newer main waits for the running one instead of cancelling it mid-upload.
concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  ship:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The nightly build number counts commits; release.sh reads the last tag.
          fetch-depth: 0

      - name: Decide what to ship
        id: decide
        run: |
          git fetch --quiet origin main --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main moved on to $(git rev-parse --short origin/main); its own run ships it."
            echo "kind=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          version=$(sed -nE 's/^ *MARKETING_VERSION: *"?([0-9.]+)"?.*/\1/p' project.yml | head -1)
          if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Release v$version (no tag yet)."
            echo "kind=release" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The commit of the current nightly, from the end of its release title:
          # "Maagical 1.4.0-nightly.71 (8cd0a1b)" (older ones: "… (5.69, 8cd0a1b)").
          last=$(gh release view nightly --json name -q .name 2>/dev/null \
            | sed -nE 's/.*[ (]([0-9a-f]{7,40})\)$/\1/p' || true)
          if [ "${{ github.event_name }}" != workflow_dispatch ] && [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
            if [ "$(git rev-parse "$last")" = "$(git rev-parse HEAD)" ]; then
              echo "The nightly is already $last."; echo "kind=none" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ -z "$(git diff --name-only "$last" HEAD -- . ':(exclude)website' ':(exclude).github/workflows/website.yml')" ]; then
              echo "Only the website changed since nightly $last."; echo "kind=none" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "Nightly of $(git rev-parse --short HEAD) (last: ${last:-none})."
          echo "kind=nightly" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 26
        if: steps.decide.outputs.kind != 'none'
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app; fi
          xcodebuild -version

      - name: Install tools
        if: steps.decide.outputs.kind != 'none'
        run: brew install xcodegen getsentry/tools/sentry-cli

      # The Developer ID certificate goes into a throwaway keychain; the other keys into
      # $RUNNER_TEMP files, all removed by the last step.
      - name: Set up signing
        if: steps.decide.outputs.kind != 'none'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GOOGLE_XCCONFIG: ${{ secrets.GOOGLE_XCCONFIG }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$DEVELOPER_ID_P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # A Developer ID identity is only valid with Apple's intermediate, which the runner
          # may lack: both generations, so either certificate chains.
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$kc" >/dev/null 2>&1 || true
          done
          if ! security find-identity -v -p codesigning "$kc" | grep -q "Developer ID Application"; then
            echo "Identities in the signing keychain (valid or not):"
            security find-identity -p codesigning "$kc" | sed -E 's/[0-9A-F]{40}/<sha1>/'
            echo "Certificates in it:"
            security find-certificate -a "$kc" | grep '"labl"' || true
            echo "::error::DEVELOPER_ID_P12 has no valid Developer ID Application identity (no private key in the .p12, or no chain to Apple)"
            exit 1
          fi

          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          printf '%s\n' "$GOOGLE_XCCONFIG" > Config/Google.xcconfig

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        if: steps.decide.outputs.kind == 'release'
        env:
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_KEY_FILE: ${{ runner.temp }}/sparkle.key
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: scripts/release.sh --publish

      - name: Nightly
        if: steps.decide.outputs.kind != 'none'
        env:
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_KEY_FILE: ${{ runner.temp }}/sparkle.key
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: scripts/release.sh --nightly --publish

      - name: Remove keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key" Config/Google.xcconfig
